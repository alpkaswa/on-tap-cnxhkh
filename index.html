<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn Tập CNXHKH - Bài 1 đến Bài 6</title>
<style>
    :root {
        --primary: #1e40af;
        --primary-light: #3b82f6;
        --success: #16a34a;
        --success-bg: #dcfce7;
        --danger: #dc2626;
        --danger-bg: #fee2e2;
        --warning: #d97706;
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --text: #0f172a;
        --border: #cbd5e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 15px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 950px; min-width: 0; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); padding: 20px; }

    header { text-align: center; border-bottom: 2px solid var(--border); padding-bottom: 15px; margin-bottom: 15px; }
    header h1 { color: var(--primary); font-size: 1.35rem; margin-bottom: 5px; }
    header p { color: #475569; font-size: 0.95rem; }

    .tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
    .tab-btn { padding: 9px 16px; border: 2px solid var(--border); background: white; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 0.88rem; color: #475569; transition: all 0.2s; }
    .tab-btn:hover { border-color: var(--primary-light); color: var(--primary); }
    .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .quiz-container { display: none; }
    .quiz-container.active { display: block; }

    .status-bar { display: flex; justify-content: space-between; align-items: center; background: #e2e8f0; padding: 10px 15px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
    .counter-badge { display: flex; gap: 15px; font-size: 0.95rem; }
    .badge-correct { color: var(--success); }
    .badge-wrong { color: var(--danger); }

    .progress-bg { height: 8px; background: #cbd5e1; border-radius: 4px; overflow: hidden; margin-bottom: 20px; }
    .progress-fill { height: 100%; background: var(--primary-light); width: 0%; transition: width 0.3s; }

    .question-list { display: block; }
    .question-card { margin-bottom: 20px; }
    .question-title { font-size: 1.08rem; font-weight: 600; margin-bottom: 15px; line-height: 1.55; color: #1e293b; }

    .options-list { display: flex; flex-direction: column; gap: 10px; }
    .option-item { padding: 12px 15px; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.2s; font-size: 0.97rem; display: flex; align-items: center; gap: 10px; line-height: 1.45; }
    .option-item:hover:not(.locked) { background-color: #f1f5f9; border-color: var(--primary-light); }
    .option-item.selected { background-color: #eff6ff; border-color: var(--primary-light); font-weight: 600; }
    .option-item.correct { background-color: var(--success-bg) !important; border-color: var(--success) !important; color: #14532d; font-weight: bold; }
    .option-item.incorrect { background-color: var(--danger-bg) !important; border-color: var(--danger) !important; color: #7f1d1d; }

    .tf-table { width: 100%; table-layout: fixed; border-collapse: collapse; margin-top: 10px; }
    .tf-table th, .tf-table td { border: 1px solid var(--border); padding: 10px; text-align: left; font-size: 0.95rem; overflow-wrap: anywhere; }
    .tf-table th { background: #f1f5f9; }
    .tf-btn-group { display: flex; gap: 8px; justify-content: center; }
    .tf-btn { padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px; background: white; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
    .tf-btn.selected-true { background: var(--primary-light); color: white; border-color: var(--primary-light); }
    .tf-btn.selected-false { background: #64748b; color: white; border-color: #64748b; }
    .tf-btn.correct-val { background: var(--success) !important; color: white !important; }
    .tf-btn.incorrect-val { background: var(--danger) !important; color: white !important; }
    .tf-btn:disabled { cursor: default; opacity: 0.95; }

    .match-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; min-width: 0; }
    .match-row { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 10px 12px; background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; }
    .match-label { font-weight: 500; font-size: 0.95rem; line-height: 1.5; }
    .match-select { padding: 8px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.93rem; width: 100%; background: white; }
    .match-select.correct-match { border-color: var(--success); background-color: var(--success-bg); font-weight: bold; color: #14532d; }
    .match-select.incorrect-match { border-color: var(--danger); background-color: var(--danger-bg); color: #7f1d1d; }
    .match-dropzone { min-height: 58px; width: 100%; }
    .match-dropzone.correct-match { border-color: var(--success); background: var(--success-bg); }
    .match-dropzone.incorrect-match { border-color: var(--danger); background: var(--danger-bg); }
    .match-correct-answer { margin-top: 6px; color: #14532d; font-size: 0.9rem; font-weight: 600; }

    .sort-layout { display: grid; gap: 12px; min-width: 0; margin-top: 10px; }
    .sort-source, .sort-column { min-width: 0; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: #f8fafc; }
    .sort-column-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .sort-heading { margin-bottom: 9px; font-size: 0.95rem; line-height: 1.45; }
    .sort-dropzone { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 7px; min-height: 64px; min-width: 0; padding: 8px; border: 2px dashed #94a3b8; border-radius: 7px; background: white; transition: border-color 0.15s, background-color 0.15s; }
    .sort-dropzone.drag-over { border-color: var(--primary-light); background: #eff6ff; }
    .sort-card { max-width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: white; color: var(--text); font: inherit; font-size: 0.9rem; line-height: 1.4; text-align: left; white-space: normal; overflow-wrap: anywhere; cursor: grab; }
    .sort-card:active { cursor: grabbing; }
    .sort-card.selected { outline: 2px solid var(--primary-light); background: #eff6ff; }
    .sort-card.correct { border-color: var(--success); background: var(--success-bg); color: #14532d; }
    .sort-card.incorrect { border-color: var(--danger); background: var(--danger-bg); color: #7f1d1d; }
    .sort-card:disabled { cursor: default; }
    @media (max-width: 700px) {
      body { min-height: 100vh; overflow-x: hidden; overflow-y: auto; padding: 8px; }
      .container { display: block; height: auto; max-height: none; min-height: 0; overflow: visible; padding: 14px; border-radius: 8px; }
      .sort-column-grid { grid-template-columns: 1fr; gap: 8px; }
      .sort-layout { gap: 9px; }
      .sort-source, .sort-column { padding: 9px; }
      .sort-dropzone { min-height: 56px; gap: 6px; padding: 7px; }
      .sort-card { padding: 7px 9px; font-size: 0.86rem; }
      .match-row { padding: 9px; }
      .option-item { padding: 10px 11px; font-size: 0.92rem; }
      .tf-table th, .tf-table td { padding: 8px; font-size: 0.88rem; }
      .tf-btn { padding: 6px 10px; }
      .btn { padding: 9px 12px; }
    }
    @media (max-width: 420px) {
      body { padding: 6px; }
      .container { padding: 10px; }
      header { padding-bottom: 10px; margin-bottom: 10px; }
      header h1 { font-size: 1.05rem; }
      header p { font-size: 0.85rem; }
      .tabs { gap: 4px; margin-bottom: 12px; }
      .tab-btn { flex: 1 1 calc(33.333% - 4px); padding: 7px 8px; font-size: 0.8rem; }
      .status-bar { padding: 8px 10px; gap: 7px; }
      .counter-badge { gap: 10px; font-size: 0.85rem; }
      .question-title { margin-bottom: 11px; font-size: 0.98rem; }
      .option-item { padding: 9px 10px; font-size: 0.88rem; }
      .sort-heading { font-size: 0.88rem; }
      .sort-card { padding: 7px 8px; font-size: 0.82rem; }
      .match-label { font-size: 0.88rem; }
      .nav-btns { gap: 6px; }
      .btn { padding: 8px 9px; font-size: 0.84rem; }
    }

    .feedback-box { margin-top: 15px; padding: 12px 15px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; display: none; line-height: 1.5; }
    .feedback-box.correct-fb { background-color: var(--success-bg); color: var(--success); border: 1px solid var(--success); }
    .feedback-box.incorrect-fb { background-color: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); }
    .feedback-box .fb-actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .btn-mini { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    .btn-mini-retry { background: var(--warning); color: white; }
    .btn-mini-retry:hover { background: #b45309; }

    .nav-btns { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    .btn { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.95rem; }
    .btn-prev { background: #64748b; color: white; }
    .btn-next { background: var(--primary-light); color: white; }
    .btn-check { background: #eab308; color: black; }
    .btn-submit { background: var(--success); color: white; }
    .btn-retry { background: var(--warning); color: white; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn:hover:not(:disabled) { filter: brightness(1.05); }

    .result-box { text-align: center; padding: 20px; }
    .score { font-size: 2.2rem; font-weight: bold; color: var(--primary); margin: 10px 0; }
    .result-details { display: flex; justify-content: center; gap: 20px; margin: 15px 0; font-weight: 600; font-size: 1.05rem; flex-wrap: wrap; }
</style>
</head>
<body>

<div class="container">
    <header>
        <h1>ÔN TẬP TRẮC NGHIỆM CHỦ NGHĨA XÃ HỘI KHOA HỌC by hoang minh nghia </h1>
        <p><b>Trọn bộ 6 bài</b></p>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('b1', event)">Bài 1</button>
        <button class="tab-btn" onclick="switchTab('b2', event)">Bài 2</button>
        <button class="tab-btn" onclick="switchTab('b3', event)">Bài 3</button>
        <button class="tab-btn" onclick="switchTab('b4', event)">Bài 4</button>
        <button class="tab-btn" onclick="switchTab('b5', event)">Bài 5</button>
        <button class="tab-btn" onclick="switchTab('b6', event)">Bài 6</button>
    </div>

    <div id="quiz-b1" class="quiz-container active"></div>
    <div id="quiz-b2" class="quiz-container"></div>
    <div id="quiz-b3" class="quiz-container"></div>
    <div id="quiz-b4" class="quiz-container"></div>
    <div id="quiz-b5" class="quiz-container"></div>
    <div id="quiz-b6" class="quiz-container"></div>
</div>

<script>
/* ============================================================
   BÀI 1 - 44 CÂU
   ============================================================ */
const bai1 = [
  { type:"single", q:"Câu 1: Những nhà tư tưởng tiêu biểu của chủ nghĩa xã hội không tưởng phê phán đầu thế kỷ XIX là ai?", opts:["A. Grắccơ Babớp, Xanh Ximông, Sáclơ Phuriê","B. Xanh Ximông, Sáclơ Phuriê, Rôbớt Ôoen","C. Xanh Ximông, Giăng Mêliê, Rôbớt Ôoen","D. Xanh Ximông, Sáclơ Phuriê, G. Mably"], ans:1 },
  { type:"single", q:"Câu 2: Tác phẩm nào đánh dấu sự ra đời của chủ nghĩa xã hội khoa học?", opts:["A. Góp phần phê phán triết học pháp quyền của Hêghen – Lời nói đầu","B. Bộ Tư bản","C. Tình cảnh giai cấp công nhân ở Anh","D. Tuyên ngôn của Đảng Cộng sản"], ans:3 },
  { type:"single", q:"Câu 3: Đối tượng nghiên cứu của chủ nghĩa xã hội khoa học là gì?", opts:["A. Là những quy luật và tính quy luật chính trị – xã hội của quá trình phát sinh, hình thành và phát triển của hình thái kinh tế – xã hội cộng sản chủ nghĩa.","B. Là những quy luật hình thành, phát triển và hoàn thiện của các hình thái kinh tế – xã hội.","C. Là những quy luật kinh tế.","D. Là những quy luật văn hoá – xã hội."], ans:0 },
  { type:"single", q:"Câu 4: Phát kiến nào của C. Mác và Ph. Ăngghen chỉ ra sự diệt vong về kinh tế của chủ nghĩa tư bản?", opts:["A. Học thuyết về sứ mệnh lịch sử toàn thế giới của giai cấp công nhân.","B. Học thuyết về giá trị thặng dư.","C. Chủ nghĩa duy vật lịch sử.","D. Chủ nghĩa duy vật biện chứng."], ans:1 },
  { type:"single", q:"Câu 5: Ph. Ăngghen đã đánh giá: “Hai phát hiện vĩ đại này đã đưa chủ nghĩa xã hội trở thành một khoa học”. Hai phát kiến đó là gì?", opts:["A. Sứ mệnh lịch sử của giai cấp công nhân – Chủ nghĩa duy vật lịch sử.","B. Chủ nghĩa duy vật biện chứng và chủ nghĩa duy vật lịch sử.","C. Học thuyết giá trị thặng dư – Chủ nghĩa duy vật lịch sử.","D. Sứ mệnh lịch sử của giai cấp công nhân – Học thuyết giá trị thặng dư."], ans:2 },
  { type:"single", q:"Câu 6: Đâu là nhân tố chủ quan quan trọng nhất để giai cấp công nhân thực hiện thắng lợi sứ mệnh lịch sử của mình?", opts:["A. Liên minh giai cấp công nhân với giai cấp nông dân.","B. Sự phát triển của giai cấp công nhân về số lượng.","C. Sự phát triển của giai cấp công nhân về chất lượng.","D. Đảng Cộng sản."], ans:3 },
  { type:"single", q:"Câu 7: Xét trong quan hệ sản xuất tư bản chủ nghĩa, giai cấp công nhân là:", opts:["A. Giai cấp nghèo khổ nhất.","B. Giai cấp không có tư liệu sản xuất, đi làm thuê cho nhà tư bản, bị nhà tư bản bóc lột giá trị thặng dư.","C. Giai cấp tạo ra của cải cho xã hội.","D. Giai cấp có số lượng đông trong dân cư."], ans:1 },
  { type:"single", q:"Câu 8: Điền từ còn thiếu: “Giai cấp công nhân và nhân dân lao động là cơ sở …, cơ sở … của Đảng Cộng sản, là nguồn bổ sung lực lượng phong phú cho Đảng.”", opts:["A. Văn hoá – xã hội.","B. Chính trị – xã hội.","C. Kinh tế – xã hội.","D. Giai cấp – xã hội."], ans:1 },
  { type:"single", q:"Câu 9: Giai cấp công nhân Việt Nam ra đời vào thời gian nào?", opts:["A. Trong cuộc khai thác thuộc địa lần thứ hai của thực dân Pháp.","B. Trước khi thực dân Pháp xâm lược Việt Nam.","C. Trong cuộc khai thác thuộc địa lần thứ nhất của thực dân Pháp.","D. Những năm đầu thế kỷ 19."], ans:2 },
  { type:"single", q:"Câu 10: Trong các nội dung sau đây, nội dung nào thuộc về giải pháp xây dựng giai cấp công nhân Việt Nam hiện nay?", opts:["A. Thực hiện tốt chính sách và pháp luật đối với công nhân và người lao động.","B. Coi trọng và giữ vững bản chất giai cấp công nhân và nguyên tắc sinh hoạt Đảng.","C. Xây dựng giai cấp công nhân lớn mạnh, có giác ngộ giai cấp và chính trị vững vàng.","D. Thực hiện chiến lược xây dựng giai cấp công nhân lớn mạnh, gắn kết chặt chẽ với chiến lược phát triển kinh tế – xã hội, công nghiệp hóa, hiện đại hóa đất nước và hội nhập quốc tế."], ans:3 },
  { type:"single", q:"Câu 11: Trong các nội dung sau đây, nội dung nào thuộc về giải pháp xây dựng giai cấp công nhân Việt Nam hiện nay?", opts:["A. Xây dựng giai cấp công nhân lớn mạnh, có giác ngộ giai cấp và chính trị vững vàng.","B. Nâng cao nhận thức, kiên định quan điểm giai cấp công nhân là giai cấp lãnh đạo cách mạng thông qua đội tiền phong là Đảng Cộng sản Việt Nam.","C. Xây dựng giai cấp công nhân tăng về số lượng và chất lượng.","D. Coi trọng và giữ vững bản chất giai cấp công nhân và nguyên tắc sinh hoạt Đảng."], ans:1 },
  { type:"single", q:"Câu 12: Điểm then chốt để giúp giai cấp công nhân Việt Nam hiện nay thực hiện thành công sứ mệnh lịch sử của mình là:", opts:["A. Coi trọng công tác xây dựng, chỉnh đốn Đảng.","B. Trí thức hóa giai cấp công nhân.","C. Phát triển giai cấp công nhân cả về số lượng và chất lượng.","D. Xây dựng khối liên minh công – nông."], ans:0 },
  { type:"single", q:"Câu 13: Xét về phương thức lao động, phương thức sản xuất, giai cấp công nhân mang thuộc tính cơ bản nào?", opts:["A. Giai cấp có tư liệu sản xuất nhiều nhất.","B. Có số lượng đông nhất trong dân cư.","C. Là giai cấp trực tiếp hay gián tiếp vận hành máy móc có tính chất công nghiệp ngày càng hiện đại.","D. Là giai cấp tạo ra của cải vật chất làm giàu cho xã hội."], ans:2 },
  { type:"multi", q:"Câu 14: Đặc điểm nào sau đây thể hiện đúng bản chất của giai cấp công nhân? (Chọn 2 đáp án đúng)", opts:["A. Có tính tổ chức và kỷ luật cao trong lao động sản xuất.","B. Có trình độ học vấn thấp, chủ yếu làm việc tay chân.","C. Luôn gắn bó với giai cấp địa chủ và tiểu thương.","D. Không sở hữu tư liệu sản xuất, sống bằng lao động làm thuê."], ans:[0,3] },
  { type:"multi", q:"Câu 15: Trong thời kỳ thuộc địa, giai cấp công nhân Việt Nam chủ yếu làm việc trong: (Chọn 2 đáp án đúng)", opts:["A. Hợp tác xã nông nghiệp.","B. Xí nghiệp thủ công truyền thống.","C. Nhà máy, hầm mỏ do thực dân Pháp xây dựng.","D. Đồn điền cao su."], ans:[2,3] },

/* ============================================================
   QUIZ ENGINE
   ============================================================ */
function createQuiz(containerId, questions) {
  const container = document.getElementById(containerId);
  let activeIndices = questions.map((_, i) => i);
  let currentActivePos = 0;
  let userAns = {};
  let checkedState = {};
  let selectedSortItem = {};
  let selectedMatchAnswer = {};

  function isCorrect(qIdx) {
    if (!checkedState[qIdx]) return null;
    const q = questions[qIdx];
    if (q.type === 'single') return userAns[qIdx] === q.ans;
    if (q.type === 'multi') {
      const u = (userAns[qIdx] || []).slice().sort().join(',');
      const c = [...q.ans].sort().join(',');
      return u === c && u !== '';
    }
    if (q.type === 'tf') {
      if (!userAns[qIdx] || Object.keys(userAns[qIdx]).length < q.items.length) return false;
      return q.items.every((it, i) => userAns[qIdx][i] === it.ans);
    }
    if (q.type === 'match') {
      if (!userAns[qIdx] || Object.keys(userAns[qIdx]).length < q.items.length) return false;
      return q.items.every((it, i) => userAns[qIdx][i] === it.ans);
    }
    if (q.type === 'sort') {
      if (!userAns[qIdx] || Object.keys(userAns[qIdx]).length < q.items.length) return false;
      return q.items.every((it, i) => userAns[qIdx][i] === it.ans);
    }
    return false;
  }

  function updateCounters() {
    let c = 0, w = 0;
    questions.forEach((_, i) => {
      const st = isCorrect(i);
      if (st === true) c++;
      else if (st === false) w++;
    });
    const currentIndex = activeIndices[currentActivePos];
    container.querySelector('.q-count').innerText =
      `Câu: ${currentActivePos + 1} / ${activeIndices.length} (Bài gốc: Câu ${currentIndex + 1})`;
    container.querySelector('.progress-fill').style.width =
      `${questions.length ? ((c + w) / questions.length) * 100 : 0}%`;
    container.querySelector('.stat-correct').innerText = c;
    container.querySelector('.stat-wrong').innerText = w;
  }

  function retryQuestion(idx) {
    delete userAns[idx];
    delete checkedState[idx];
    delete selectedSortItem[idx];
    delete selectedMatchAnswer[idx];
    updateCounters();
    const questionCard = container.querySelector(`[data-question-index="${idx}"]`);
    if (questionCard) renderQuestion(idx, questionCard);
  }

  function retryCurrent() {
    retryQuestion(activeIndices[currentActivePos]);
  }

  function enableTouchDrag(card, questionCard, onDrop) {
    card.style.touchAction = 'none';
    card.addEventListener('pointerdown', (startEvent) => {
      if (startEvent.pointerType === 'mouse' || startEvent.button !== 0) return;
      const startX = startEvent.clientX;
      const startY = startEvent.clientY;
      const pointerId = startEvent.pointerId;
      let moved = false;

      const clearHighlights = () => {
        questionCard.querySelectorAll('.sort-dropzone.drag-over').forEach(zone => zone.classList.remove('drag-over'));
      };
      const cleanup = () => {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onCancel);
        clearHighlights();
      };
      const onMove = (event) => {
        if (event.pointerId !== pointerId) return;
        if (Math.hypot(event.clientX - startX, event.clientY - startY) < 8) return;
        moved = true;
        event.preventDefault();
        clearHighlights();
        const target = document.elementFromPoint(event.clientX, event.clientY);
        const zone = target?.closest('.sort-dropzone');
        if (zone && questionCard.contains(zone)) zone.classList.add('drag-over');
      };
      const onUp = (event) => {
        if (event.pointerId !== pointerId) return;
        cleanup();
        if (!moved) return;
        event.preventDefault();
        const target = document.elementFromPoint(event.clientX, event.clientY);
        const zone = target?.closest('.sort-dropzone');
        if (zone && questionCard.contains(zone)) onDrop(zone);
      };
      const onCancel = (event) => {
        if (event.pointerId === pointerId) cleanup();
      };

      document.addEventListener('pointermove', onMove, { passive: false });
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onCancel);
    });
  }

  function renderQuestion(idx, questionCard) {
    const q = questions[idx];
    const useTouchDrag = window.matchMedia('(max-width: 700px)').matches || navigator.maxTouchPoints > 0;
    const useCompactControls = false;

    questionCard.querySelector('.q-text').innerText = q.q;

    const content = questionCard.querySelector('.q-content');
    content.innerHTML = '';
    const fb = questionCard.querySelector('.feedback-box');
    fb.style.display = 'none';
    fb.className = 'feedback-box';

    const isChecked = checkedState[idx] || false;
    const checkBtn = questionCard.querySelector('.btn-check');

    if (q.type === 'single') {
      checkBtn.style.display = 'none';
      const wrap = document.createElement('div');
      wrap.className = 'options-list';
      const sel = userAns[idx];
      q.opts.forEach((opt, i) => {
        const d = document.createElement('div');
        d.className = 'option-item';
        if (sel === i) d.classList.add('selected');
        if (isChecked) {
          d.classList.add('locked');
          if (i === q.ans) d.classList.add('correct');
          else if (sel === i) d.classList.add('incorrect');
        }
        d.innerText = opt;
        d.onclick = () => {
          if (isChecked) return;
          userAns[idx] = i;
          checkedState[idx] = true;
          updateCounters();
          renderQuestion(idx, questionCard);
        };
        wrap.appendChild(d);
      });
      content.appendChild(wrap);
      if (isChecked) {
        fb.style.display = 'block';
        if (sel === q.ans) { fb.classList.add('correct-fb'); fb.innerHTML = '✅ Chính xác!'; }
        else {
          fb.classList.add('incorrect-fb');
          fb.innerHTML = `❌ Chưa chính xác. Đáp án đúng: <u>${q.opts[q.ans]}</u>
            <div class="fb-actions">
              <button class="btn-mini btn-mini-retry" onclick="window['retry_${containerId}']()">🔄 Làm lại câu này</button>
              <span style="color:#7f1d1d;font-weight:500;font-size:0.85rem;">hoặc bấm "Câu sau" để giữ nguyên và tiếp tục</span>
            </div>`;
        }
      }
    }
    else if (q.type === 'multi') {
      checkBtn.style.display = isChecked ? 'none' : 'inline-block';
      const wrap = document.createElement('div');
      wrap.className = 'options-list';
      if (!userAns[idx]) userAns[idx] = [];
      const selList = userAns[idx];
      q.opts.forEach((opt, i) => {
        const d = document.createElement('div');
        d.className = 'option-item';
        if (selList.includes(i)) d.classList.add('selected');
        if (isChecked) {
          d.classList.add('locked');
          if (q.ans.includes(i)) d.classList.add('correct');
          else if (selList.includes(i)) d.classList.add('incorrect');
        }
        d.innerText = opt;
        d.onclick = () => {
          if (isChecked) return;
          const p = userAns[idx].indexOf(i);
          if (p > -1) userAns[idx].splice(p, 1);
          else userAns[idx].push(i);
          renderQuestion(idx, questionCard);
        };
        wrap.appendChild(d);
      });
      content.appendChild(wrap);
      if (isChecked) {
        fb.style.display = 'block';
        const u = selList.slice().sort().join(',');
        const c = [...q.ans].sort().join(',');
        if (u === c) { fb.classList.add('correct-fb'); fb.innerHTML = '✅ Chính xác!'; }
        else {
          fb.classList.add('incorrect-fb');
          fb.innerHTML = `❌ Chưa chính xác. Đáp án đúng: <u>${q.ans.map(i => q.opts[i]).join('; ')}</u>
            <div class="fb-actions">
              <button class="btn-mini btn-mini-retry" onclick="window['retry_${containerId}']()">🔄 Làm lại câu này</button>
              <span style="color:#7f1d1d;font-weight:500;font-size:0.85rem;">hoặc bấm "Câu sau" để giữ nguyên và tiếp tục</span>
            </div>`;
        }
      }
    }
    else if (q.type === 'tf') {
      checkBtn.style.display = isChecked ? 'none' : 'inline-block';
      if (!userAns[idx]) userAns[idx] = {};
      const table = document.createElement('table');
      table.className = 'tf-table';
      table.innerHTML = `<thead><tr><th>Phát biểu</th><th style="width:150px;text-align:center;">Lựa chọn</th></tr></thead><tbody></tbody>`;
      const tbody = table.querySelector('tbody');
      q.items.forEach((item, i) => {
        const tr = document.createElement('tr');
        const val = userAns[idx][i];
        let tC = 'tf-btn', fC = 'tf-btn';
        if (val === true) tC += ' selected-true';
        if (val === false) fC += ' selected-false';
        if (isChecked) {
          if (item.ans === true) tC += ' correct-val';
          else if (val === true) tC += ' incorrect-val';
          if (item.ans === false) fC += ' correct-val';
          else if (val === false) fC += ' incorrect-val';
        }
        tr.innerHTML = `<td>${item.text}</td><td style="text-align:center;"><div class="tf-btn-group">
          <button class="${tC}" ${isChecked ? 'disabled' : ''} onclick="window['q_${containerId}'].setTF(${idx},${i},true)">Đúng</button>
          <button class="${fC}" ${isChecked ? 'disabled' : ''} onclick="window['q_${containerId}'].setTF(${idx},${i},false)">Sai</button>
        </div></td>`;
        tbody.appendChild(tr);
      });
      content.appendChild(table);
      if (isChecked) {
        fb.style.display = 'block';
        if (isCorrect(idx)) { fb.classList.add('correct-fb'); fb.innerHTML = '✅ Chính xác tất cả các phát biểu!'; }
        else {
          fb.classList.add('incorrect-fb');
          fb.innerHTML = `❌ Chưa chính xác. Hãy xem các ô màu xanh (đáp án đúng) và màu đỏ (bạn chọn sai).
            <div class="fb-actions">
              <button class="btn-mini btn-mini-retry" onclick="window['retry_${containerId}']()">🔄 Làm lại câu này</button>
              <span style="color:#7f1d1d;font-weight:500;font-size:0.85rem;">hoặc bấm "Câu sau" để giữ nguyên và tiếp tục</span>
            </div>`;
        }
      }
    }
    else if (q.type === 'match' && q.q.includes('Kéo thả') && useCompactControls) {
      checkBtn.style.display = isChecked ? 'none' : 'inline-block';
      if (!userAns[idx]) userAns[idx] = {};
      const wrap = document.createElement('div');
      wrap.className = 'match-list';
      q.items.forEach((item, itemIndex) => {
        const row = document.createElement('div');
        row.className = 'match-row';
        const label = document.createElement('div');
        label.className = 'match-label';
        label.innerText = item.label;
        const select = document.createElement('select');
        select.className = 'match-select mobile-match-select';
        select.setAttribute('aria-label', `Chọn đáp án cho phát biểu ${itemIndex + 1}`);
        select.disabled = isChecked;
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.innerText = '-- Chọn đáp án --';
        select.appendChild(placeholder);
        q.pool.forEach((answer) => {
          const option = document.createElement('option');
          option.value = answer;
          option.innerText = answer;
          if (userAns[idx][itemIndex] === answer) option.selected = true;
          select.appendChild(option);
        });
        select.onchange = (event) => {
          if (event.target.value) userAns[idx][itemIndex] = event.target.value;
          else delete userAns[idx][itemIndex];
        };
        const answer = userAns[idx][itemIndex];
        if (isChecked) {
          if (answer === item.ans) select.classList.add('correct-match');
          else select.classList.add('incorrect-match');
        }
        row.appendChild(label);
        row.appendChild(select);
        if (isChecked && answer !== item.ans) {
          const correctAnswer = document.createElement('div');
          correctAnswer.className = 'match-correct-answer';
          correctAnswer.innerText = `Đáp án đúng: ${item.ans}`;
          row.appendChild(correctAnswer);
        }
        wrap.appendChild(row);
      });
      content.appendChild(wrap);
      if (isChecked) {
        fb.style.display = 'block';
        if (isCorrect(idx)) { fb.classList.add('correct-fb'); fb.innerHTML = '✅ Ghép đáp án chính xác!'; }
        else {
          fb.classList.add('incorrect-fb');
          fb.innerHTML = `❌ Chưa chính xác. Đáp án đúng được hiển thị dưới từng phát biểu.
            <div class="fb-actions">
              <button class="btn-mini btn-mini-retry" onclick="window['retry_${containerId}']()">🔄 Làm lại câu này</button>
              <span style="color:#7f1d1d;font-weight:500;font-size:0.85rem;">hoặc bấm "Câu sau" để giữ nguyên và tiếp tục</span>
            </div>`;
        }
      }
    }
    else if (q.type === 'match' && q.q.includes('Kéo thả')) {
      checkBtn.style.display = isChecked ? 'none' : 'inline-block';
      if (!userAns[idx]) userAns[idx] = {};
      const layout = document.createElement('div');
      layout.className = 'sort-layout';

      const source = document.createElement('section');
      source.className = 'sort-source';
      const sourceHeading = document.createElement('h3');
      sourceHeading.className = 'sort-heading';
      sourceHeading.innerText = 'Các đáp án cần kéo thả';
      const sourceZone = document.createElement('div');
      sourceZone.className = 'sort-dropzone';
      sourceZone.setAttribute('aria-label', 'Các đáp án chưa ghép');
      const matchList = document.createElement('div');
      matchList.className = 'match-list';

      const assignAnswer = (itemIndex, answer) => {
        Object.keys(userAns[idx]).forEach((assignedIndex) => {
          if (Number(assignedIndex) !== itemIndex && userAns[idx][assignedIndex] === answer) {
            delete userAns[idx][assignedIndex];
          }
        });
        userAns[idx][itemIndex] = answer;
        selectedMatchAnswer[idx] = null;
        renderQuestion(idx, questionCard);
      };
      const returnAnswer = (answer) => {
        Object.keys(userAns[idx]).forEach((assignedIndex) => {
          if (userAns[idx][assignedIndex] === answer) delete userAns[idx][assignedIndex];
        });
        selectedMatchAnswer[idx] = null;
        renderQuestion(idx, questionCard);
      };
      const configureMatchDrop = (zone, itemIndex) => {
        zone.dataset.matchTarget = itemIndex === null ? 'source' : String(itemIndex);
        zone.ondragover = (event) => {
          if (isChecked) return;
          event.preventDefault();
          zone.classList.add('drag-over');
        };
        zone.ondragleave = () => zone.classList.remove('drag-over');
        zone.ondrop = (event) => {
          event.preventDefault();
          zone.classList.remove('drag-over');
          const answerIndex = Number(event.dataTransfer.getData('text/plain'));
          if (Number.isInteger(answerIndex) && answerIndex >= 0 && answerIndex < q.pool.length) {
            if (itemIndex === null) returnAnswer(q.pool[answerIndex]);
            else assignAnswer(itemIndex, q.pool[answerIndex]);
          }
        };
      };
      const createAnswerCard = (answer, itemIndex) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'sort-card';
        card.innerText = answer;
        card.draggable = !isChecked && !useTouchDrag;
        card.disabled = isChecked;
        card.setAttribute('aria-pressed', String(selectedMatchAnswer[idx] === answer));
        if (!isChecked && selectedMatchAnswer[idx] === answer) card.classList.add('selected');
        if (isChecked && itemIndex !== null) {
          if (answer === q.items[itemIndex].ans) card.classList.add('correct');
          else card.classList.add('incorrect');
        }
        card.ondragstart = (event) => {
          event.dataTransfer.setData('text/plain', String(q.pool.indexOf(answer)));
          event.dataTransfer.effectAllowed = 'move';
        };
        enableTouchDrag(card, questionCard, (zone) => {
          if (zone.dataset.matchTarget === 'source') returnAnswer(answer);
          else if (zone.dataset.matchTarget !== undefined) assignAnswer(Number(zone.dataset.matchTarget), answer);
        });
        card.onclick = (event) => {
          event.stopPropagation();
          if (isChecked) return;
          selectedMatchAnswer[idx] = selectedMatchAnswer[idx] === answer ? null : answer;
          renderQuestion(idx, questionCard);
        };
        return card;
      };

      configureMatchDrop(sourceZone, null);
      source.onclick = () => {
        if (!isChecked && selectedMatchAnswer[idx] != null) returnAnswer(selectedMatchAnswer[idx]);
      };
      q.pool.forEach((answer) => {
        if (!Object.values(userAns[idx]).includes(answer)) {
          sourceZone.appendChild(createAnswerCard(answer, null));
        }
      });
      source.appendChild(sourceHeading);
      source.appendChild(sourceZone);
      layout.appendChild(source);

      q.items.forEach((item, itemIndex) => {
        const row = document.createElement('div');
        row.className = 'match-row';
        const label = document.createElement('div');
        label.className = 'match-label';
        label.innerText = item.label;
        const zone = document.createElement('div');
        zone.className = 'sort-dropzone match-dropzone';
        zone.setAttribute('aria-label', `Thả đáp án cho phát biểu ${itemIndex + 1}`);
        configureMatchDrop(zone, itemIndex);
        zone.onclick = () => {
          if (!isChecked && selectedMatchAnswer[idx] != null) assignAnswer(itemIndex, selectedMatchAnswer[idx]);
        };
        row.onclick = () => {
          if (!isChecked && selectedMatchAnswer[idx] != null) assignAnswer(itemIndex, selectedMatchAnswer[idx]);
        };
        row.appendChild(label);
        const answer = userAns[idx][itemIndex];
        if (answer) zone.appendChild(createAnswerCard(answer, itemIndex));
        if (isChecked) {
          if (answer === item.ans) zone.classList.add('correct-match');
          else zone.classList.add('incorrect-match');
        }
        row.appendChild(zone);
        if (isChecked && answer !== item.ans) {
          const correctAnswer = document.createElement('div');
          correctAnswer.className = 'match-correct-answer';
          correctAnswer.innerText = `Đáp án đúng: ${item.ans}`;
          row.appendChild(correctAnswer);
        }
        matchList.appendChild(row);
      });
      layout.appendChild(matchList);
      content.appendChild(layout);

      if (isChecked) {
        fb.style.display = 'block';
        if (isCorrect(idx)) { fb.classList.add('correct-fb'); fb.innerHTML = '✅ Ghép đáp án chính xác!'; }
        else {
          fb.classList.add('incorrect-fb');
          fb.innerHTML = `❌ Chưa chính xác. Đáp án đúng được hiển thị dưới từng phát biểu.
            <div class="fb-actions">
              <button class="btn-mini btn-mini-retry" onclick="window['retry_${containerId}']()">🔄 Làm lại câu này</button>
              <span style="color:#7f1d1d;font-weight:500;font-size:0.85rem;">hoặc bấm "Câu sau" để giữ nguyên và tiếp tục</span>
            </div>`;
        }
      }
    }
    else if (q.type === 'match') {
      checkBtn.style.display = isChecked ? 'none' : 'inline-block';
      if (!userAns[idx]) userAns[idx] = {};
      const wrap = document.createElement('div');
      wrap.className = 'match-list';
      q.items.forEach((item, i) => {
        const row = document.createElement('div');
        row.className = 'match-row';
        const lbl = document.createElement('div');
        lbl.className = 'match-label';
        lbl.innerText = item.label;
        const sel = document.createElement('select');
        sel.className = 'match-select';
        if (isChecked) sel.disabled = true;
        const def = document.createElement('option');
        def.value = '';
        def.innerText = '-- Chọn từ/cụm từ ghép phù hợp --';
        sel.appendChild(def);
        q.pool.forEach(p => {
          const o = document.createElement('option');
          o.value = p;
          o.innerText = p;
          if (userAns[idx][i] === p) o.selected = true;
          sel.appendChild(o);
        });
        sel.onchange = (e) => { userAns[idx][i] = e.target.value; };
        if (isChecked) {
          if (userAns[idx][i] === item.ans) sel.classList.add('correct-match');
          else sel.classList.add('incorrect-match');
        }
        row.appendChild(lbl);
        row.appendChild(sel);
        wrap.appendChild(row);
      });
      content.appendChild(wrap);
      if (isChecked) {
        fb.style.display = 'block';
        if (isCorrect(idx)) { fb.classList.add('correct-fb'); fb.innerHTML = '✅ Ghép đáp án chính xác!'; }
        else {
          fb.classList.add('incorrect-fb');
          fb.innerHTML = `❌ Chưa chính xác. Đáp án đúng là các từ hiển thị trên nền xanh.
            <div class="fb-actions">
              <button class="btn-mini btn-mini-retry" onclick="window['retry_${containerId}']()">🔄 Làm lại câu này</button>
              <span style="color:#7f1d1d;font-weight:500;font-size:0.85rem;">hoặc bấm "Câu sau" để giữ nguyên và tiếp tục</span>
            </div>`;
        }
      }
    }
    else if (q.type === 'sort' && useCompactControls) {
      checkBtn.style.display = isChecked ? 'none' : 'inline-block';
      if (!userAns[idx]) userAns[idx] = {};
      const wrap = document.createElement('div');
      wrap.className = 'match-list';
      q.items.forEach((item, itemIndex) => {
        const row = document.createElement('div');
        row.className = 'match-row';
        const label = document.createElement('div');
        label.className = 'match-label';
        label.innerText = item.label;
        const select = document.createElement('select');
        select.className = 'match-select mobile-match-select';
        select.setAttribute('aria-label', `Chọn cột cho yếu tố ${itemIndex + 1}`);
        select.disabled = isChecked;
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.innerText = '-- Chọn điều kiện --';
        select.appendChild(placeholder);
        q.categories.forEach((category) => {
          const option = document.createElement('option');
          option.value = category.id;
          option.innerText = category.label;
          if (userAns[idx][itemIndex] === category.id) option.selected = true;
          select.appendChild(option);
        });
        select.onchange = (event) => {
          if (event.target.value) userAns[idx][itemIndex] = event.target.value;
          else delete userAns[idx][itemIndex];
        };
        if (isChecked) {
          if (userAns[idx][itemIndex] === item.ans) select.classList.add('correct-match');
          else select.classList.add('incorrect-match');
        }
        row.appendChild(label);
        row.appendChild(select);
        if (isChecked && userAns[idx][itemIndex] !== item.ans) {
          const correctAnswer = document.createElement('div');
          correctAnswer.className = 'match-correct-answer';
          correctAnswer.innerText = `Đáp án đúng: ${q.categories.find(category => category.id === item.ans)?.label || item.ans}`;
          row.appendChild(correctAnswer);
        }
        wrap.appendChild(row);
      });
      content.appendChild(wrap);
      if (isChecked) {
        fb.style.display = 'block';
        if (isCorrect(idx)) { fb.classList.add('correct-fb'); fb.innerHTML = '✅ Phân loại chính xác!'; }
        else {
          fb.classList.add('incorrect-fb');
          fb.innerHTML = `❌ Chưa chính xác. Đáp án đúng được hiển thị dưới từng yếu tố.
            <div class="fb-actions">
              <button class="btn-mini btn-mini-retry" onclick="window['retry_${containerId}']()">🔄 Làm lại câu này</button>
              <span style="color:#7f1d1d;font-weight:500;font-size:0.85rem;">hoặc bấm "Câu sau" để giữ nguyên và tiếp tục</span>
            </div>`;
        }
      }
    }
    else if (q.type === 'sort') {
      checkBtn.style.display = isChecked ? 'none' : 'inline-block';
      if (!userAns[idx]) userAns[idx] = {};
      const layout = document.createElement('div');
      layout.className = 'sort-layout';

      const source = document.createElement('section');
      source.className = 'sort-source';
      source.onclick = () => {
        if (isChecked || selectedSortItem[idx] == null) return;
        placeItem(selectedSortItem[idx], '');
      };
      const sourceHeading = document.createElement('h3');
      sourceHeading.className = 'sort-heading';
      sourceHeading.innerText = 'Các yếu tố cần phân loại';
      const sourceZone = document.createElement('div');
      sourceZone.className = 'sort-dropzone';
      sourceZone.setAttribute('aria-label', 'Các yếu tố chưa được xếp vào cột');
      const columnGrid = document.createElement('div');
      columnGrid.className = 'sort-column-grid';

      const placeItem = (itemIndex, categoryId) => {
        if (categoryId) userAns[idx][itemIndex] = categoryId;
        else delete userAns[idx][itemIndex];
        selectedSortItem[idx] = null;
        renderQuestion(idx, questionCard);
      };
      const configureDropZone = (zone, categoryId) => {
        zone.dataset.categoryId = categoryId;
        zone.ondragover = (event) => {
          if (isChecked) return;
          event.preventDefault();
          zone.classList.add('drag-over');
        };
        zone.ondragleave = () => zone.classList.remove('drag-over');
        zone.ondrop = (event) => {
          event.preventDefault();
          zone.classList.remove('drag-over');
          const itemIndex = Number(event.dataTransfer.getData('text/plain'));
          if (Number.isInteger(itemIndex) && itemIndex >= 0 && itemIndex < q.items.length) {
            placeItem(itemIndex, categoryId);
          }
        };
        zone.onclick = () => {
          if (isChecked || selectedSortItem[idx] == null) return;
          placeItem(selectedSortItem[idx], categoryId);
        };
      };
      const createSortCard = (item, itemIndex) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'sort-card';
        card.innerText = item.label;
        card.draggable = !isChecked && !useTouchDrag;
        card.disabled = isChecked;
        card.setAttribute('aria-pressed', String(selectedSortItem[idx] === itemIndex));
        if (selectedSortItem[idx] === itemIndex && !isChecked) card.classList.add('selected');
        if (isChecked) {
          if (userAns[idx][itemIndex] === item.ans) card.classList.add('correct');
          else card.classList.add('incorrect');
        }
        card.ondragstart = (event) => {
          event.dataTransfer.setData('text/plain', String(itemIndex));
          event.dataTransfer.effectAllowed = 'move';
        };
        enableTouchDrag(card, questionCard, (zone) => placeItem(itemIndex, zone.dataset.categoryId || ''));
        card.onclick = (event) => {
          event.stopPropagation();
          if (isChecked) return;
          selectedSortItem[idx] = selectedSortItem[idx] === itemIndex ? null : itemIndex;
          renderQuestion(idx, questionCard);
        };
        return card;
      };

      configureDropZone(sourceZone, '');
      q.items.forEach((item, itemIndex) => {
        if (!userAns[idx][itemIndex]) sourceZone.appendChild(createSortCard(item, itemIndex));
      });
      source.appendChild(sourceHeading);
      source.appendChild(sourceZone);
      layout.appendChild(source);

      q.categories.forEach((category) => {
        const column = document.createElement('section');
        column.className = 'sort-column';
        column.onclick = () => {
          if (isChecked || selectedSortItem[idx] == null) return;
          placeItem(selectedSortItem[idx], category.id);
        };
        const heading = document.createElement('h3');
        heading.className = 'sort-heading';
        heading.innerText = category.label;
        const zone = document.createElement('div');
        zone.className = 'sort-dropzone';
        zone.setAttribute('aria-label', category.label);
        configureDropZone(zone, category.id);
        q.items.forEach((item, itemIndex) => {
          if (userAns[idx][itemIndex] === category.id) zone.appendChild(createSortCard(item, itemIndex));
        });
        column.appendChild(heading);
        column.appendChild(zone);
        columnGrid.appendChild(column);
      });
      layout.appendChild(columnGrid);
      content.appendChild(layout);

      if (isChecked) {
        fb.style.display = 'block';
        if (isCorrect(idx)) { fb.classList.add('correct-fb'); fb.innerHTML = '✅ Phân loại chính xác!'; }
        else {
          fb.classList.add('incorrect-fb');
          fb.innerHTML = `❌ Chưa chính xác. Yếu tố màu xanh được xếp đúng; yếu tố màu đỏ cần xếp lại.
            <div class="fb-actions">
              <button class="btn-mini btn-mini-retry" onclick="window['retry_${containerId}']()">🔄 Làm lại câu này</button>
              <span style="color:#7f1d1d;font-weight:500;font-size:0.85rem;">hoặc bấm "Câu sau" để giữ nguyên và tiếp tục</span>
            </div>`;
        }
      }
    }

    const retryButton = fb.querySelector('.btn-mini-retry');
    if (retryButton) retryButton.onclick = () => retryQuestion(idx);
  }

  function render() {
    const list = container.querySelector('.question-list');
    list.innerHTML = '';
    const idx = activeIndices[currentActivePos];
    const questionCard = document.createElement('article');
    questionCard.className = 'question-card';
    questionCard.dataset.questionIndex = idx;
    questionCard.innerHTML = '<div class="question-title q-text"></div><div class="q-content"></div><div class="nav-btns"><button class="btn btn-prev" type="button">Câu trước</button><button class="btn btn-check" type="button" style="display:none;">Kiểm tra đáp án</button><button class="btn btn-next" type="button">Câu sau</button><button class="btn btn-submit" type="button" style="display:none;">Nộp bài</button></div><div class="feedback-box"></div>';
    questionCard.querySelector('.btn-prev').disabled = currentActivePos === 0;
    questionCard.querySelector('.btn-prev').onclick = () => changeQ(-1);
    questionCard.querySelector('.btn-next').style.display = currentActivePos === activeIndices.length - 1 ? 'none' : 'inline-block';
    questionCard.querySelector('.btn-next').onclick = () => changeQ(1);
    questionCard.querySelector('.btn-check').onclick = () => checkQuestion(idx);
    questionCard.querySelector('.btn-submit').style.display = currentActivePos === activeIndices.length - 1 ? 'inline-block' : 'none';
    questionCard.querySelector('.btn-submit').onclick = submitQuiz;
    list.appendChild(questionCard);
    renderQuestion(idx, questionCard);
    updateCounters();
  }

  function changeQ(dir) {
    currentActivePos = Math.max(0, Math.min(activeIndices.length - 1, currentActivePos + dir));
    selectedSortItem[activeIndices[currentActivePos]] = null;
    selectedMatchAnswer[activeIndices[currentActivePos]] = null;
    render();
  }

  function setTF(idx, subIdx, val) {
    if (!userAns[idx]) userAns[idx] = {};
    userAns[idx][subIdx] = val;
    const questionCard = container.querySelector(`[data-question-index="${idx}"]`);
    if (questionCard) renderQuestion(idx, questionCard);
  }

  function checkQuestion(idx) {
    const q = questions[idx];
    if (q.type === 'multi') {
      if (!userAns[idx] || userAns[idx].length === 0) { alert("Vui lòng chọn đáp án trước khi kiểm tra!"); return; }
    } else if (q.type === 'tf') {
      if (Object.keys(userAns[idx] || {}).length < q.items.length) { alert("Vui lòng chọn Đúng hoặc Sai cho tất cả các phát biểu!"); return; }
    } else if (q.type === 'match') {
      if (Object.keys(userAns[idx] || {}).length < q.items.length) { alert("Vui lòng ghép đáp án vào tất cả các phát biểu!"); return; }
    } else if (q.type === 'sort') {
      if (Object.keys(userAns[idx] || {}).length < q.items.length) { alert("Vui lòng chọn điều kiện cho tất cả các yếu tố!"); return; }
    }
    selectedSortItem[idx] = null;
    selectedMatchAnswer[idx] = null;
    checkedState[idx] = true;
    updateCounters();
    const questionCard = container.querySelector(`[data-question-index="${idx}"]`);
    if (questionCard) renderQuestion(idx, questionCard);
  }

  function submitQuiz() {
    activeIndices.forEach(i => { checkedState[i] = true; });
    updateCounters();
    let c = 0, w = 0;
    questions.forEach((_, i) => { if (isCorrect(i) === true) c++; else w++; });
    container.querySelector('.quiz-box').style.display = 'none';
    container.querySelector('.result-box').style.display = 'block';
    container.querySelector('.score-text').innerText = `${c} / ${questions.length}`;
    container.querySelector('.pct-text').innerText = `Tỷ lệ chính xác: ${Math.round((c / questions.length) * 100)}%`;
    container.querySelector('.final-correct').innerText = c;
    container.querySelector('.final-wrong').innerText = w;
    container.querySelector('.btn-retry-wrong').style.display = w === 0 ? 'none' : 'inline-block';
  }

  function retryWrong() {
    let wrongIdx = [];
    questions.forEach((_, i) => {
      if (isCorrect(i) !== true) { wrongIdx.push(i); delete userAns[i]; delete checkedState[i]; }
    });
    if (wrongIdx.length === 0) { alert("Bạn đã trả lời đúng toàn bộ các câu!"); return; }
    activeIndices = wrongIdx;
    currentActivePos = 0;
    container.querySelector('.quiz-box').style.display = 'block';
    container.querySelector('.result-box').style.display = 'none';
    updateCounters();
    render();
  }

  function resetQuiz() {
    userAns = {}; checkedState = {};
    selectedSortItem = {};
    selectedMatchAnswer = {};
    activeIndices = questions.map((_, i) => i);
    currentActivePos = 0;
    container.querySelector('.quiz-box').style.display = 'block';
    container.querySelector('.result-box').style.display = 'none';
    updateCounters();
    render();
  }

  window[`retry_${containerId}`] = retryCurrent;

  container.innerHTML = `
    <div class="status-bar">
      <span class="q-count">Câu: 1 / ${questions.length} (Bài gốc: Câu 1)</span>
      <div class="counter-badge">
        <span class="badge-correct">Đúng: <span class="stat-correct">0</span></span>
        <span class="badge-wrong">Sai: <span class="stat-wrong">0</span></span>
      </div>
    </div>
    <div class="progress-bg"><div class="progress-fill"></div></div>
    <div class="quiz-box">
      <div class="question-list"></div>
    </div>
    <div class="result-box" style="display:none;">
      <h2>KẾT QUẢ BÀI LÀM</h2>
      <div class="score score-text">0 / ${questions.length}</div>
      <p class="pct-text"></p>
      <div class="result-details">
        <span style="color:var(--success);">Số câu đúng: <span class="final-correct">0</span></span>
        <span style="color:var(--danger);">Số câu sai: <span class="final-wrong">0</span></span>
      </div>
      <div style="display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap;">
        <button class="btn btn-retry btn-retry-wrong" onclick="window['q_${containerId}'].retryWrong()">Làm lại các câu sai</button>
        <button class="btn btn-next" onclick="window['q_${containerId}'].resetQuiz()">Làm lại từ đầu</button>
      </div>
    </div>
  `;

  const api = { changeQ, checkQuestion, retryQuestion, setTF, submitQuiz, retryWrong, resetQuiz, render, updateCounters };
  window[`q_${containerId}`] = api;
  if (container.classList.contains('active')) render();
  else updateCounters();
  return api;
}

createQuiz('quiz-b1', bai1);
createQuiz('quiz-b2', bai2);
createQuiz('quiz-b3', bai3);
createQuiz('quiz-b4', bai4);
createQuiz('quiz-b5', bai5);
createQuiz('quiz-b6', bai6);

function switchTab(tab, evt) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.quiz-container').forEach(c => c.classList.remove('active'));
  if (evt) evt.target.classList.add('active');
  document.getElementById('quiz-' + tab).classList.add('active');
  window[`q_quiz-${tab}`].render();
}
</script>
